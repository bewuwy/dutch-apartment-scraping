[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dutch-apartment-hunter"
version = "0.1.0"
description = "Dutch rental housing scraper, filter, and Telegram notifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "curl-cffi>=0.7.0",
    "lxml>=5.0.0",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[tool.setuptools]
py-modules = ["models", "main", "agent_review"]

[tool.setuptools.packages.find]
include = ["filters*", "notifications*", "scrapers*"]
exclude = ["data*", "external_tools*"]
